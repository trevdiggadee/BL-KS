<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEONBLOCK - 3D Neon Arcade Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div class="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>
  </div>

  <!-- Main Menu / Start Overlay -->
  <div id="screen-start" class="overlay-screen active">
    <div class="menu-card">
      <h1 class="logo-title">NEON<span class="highlight">BLOCK</span></h1>
      <p class="tagline">3D NEON ARCADE PUZZLE</p>

      <div class="menu-actions">
        <button id="btn-start" class="btn btn--primary btn--lg">
          <span class="btn__icon">&#9654;</span> PLAY GAME
        </button>
        <button id="btn-nav-stats" class="btn btn--secondary">
          <span class="btn__icon">&#128202;</span> STATS
        </button>
        <button id="btn-nav-settings" class="btn btn--secondary">
          <span class="btn__icon">&#9881;</span> SETTINGS
        </button>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="pieces.js"></script>
  <script src="scoring.js"></script>
  <script src="input.js"></script>
  <script src="effects.js"></script>
  <script src="stats.js"></script>
  <script src="settings.js"></script>
  <script src="main.js"></script>
</body>
</html>
