<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#070a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Blocks">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Neon Blocks</title>
</head>
<body>
  <div class="particles" aria-hidden="true"></div>
  <main id="app">
    <section id="home" class="screen active">
      <div class="brand"><span>NEON</span><b>BLOCKS</b></div>
      <div class="hero-card">
        <div class="mini-board" id="miniBoard"></div>
        <div class="home-stats">
          <div><small>HIGH SCORE</small><strong id="homeHigh">0</strong></div>
          <div><small>LINES</small><strong id="homeLines">0</strong></div>
        </div>
      </div>
      <button class="primary" id="playBtn">PLAY</button>
      <div class="home-grid">
        <button class="glass" data-screen="stats">STATS</button>
        <button class="glass" data-screen="how">HOW TO PLAY</button>
        <button class="glass" data-screen="settings">SETTINGS</button>
      </div>
    </section>

    <section id="game" class="screen">
      <header class="game-head">
        <button class="icon-btn" id="pauseBtn">Ⅱ</button>
        <div><small>SCORE</small><strong id="score">0</strong></div>
        <div><small>LEVEL</small><strong id="level">1</strong></div>
        <div><small>LINES</small><strong id="lines">0</strong></div>
      </header>
      <div class="game-layout">
        <aside class="side left">
          <div class="panel"><label>HOLD</label><canvas id="holdCanvas" width="120" height="100"></canvas></div>
        </aside>
        <div class="board-wrap"><canvas id="board" aria-label="Game board"></canvas></div>
        <aside class="side right">
          <div class="panel"><label>NEXT</label><canvas id="nextCanvas" width="120" height="250"></canvas></div>
        </aside>
      </div>
      <div class="mobile-controls">
        <button data-action="left">◀</button>
        <button data-action="down">▼</button>
        <button data-action="right">▶</button>
        <button data-action="rotate">↻</button>
        <button class="drop" data-action="drop">DROP</button>
        <button data-action="hold">HOLD</button>
      </div>
    </section>

    <section id="stats" class="screen">
      <header class="subhead"><button class="back">‹</button><h2>STATISTICS</h2></header>
      <div class="cards" id="statsCards"></div>
      <div class="history"><h3>RECENT GAMES</h3><div id="historyList"></div></div>
    </section>

    <section id="how" class="screen">
      <header class="subhead"><button class="back">‹</button><h2>HOW TO PLAY</h2></header>
      <div class="info-card">
        <h3>Build. Clear. Repeat.</h3>
        <p>Move and rotate falling blocks to create complete horizontal lines. Clearing four lines at once is a Tetris.</p>
        <div class="key-row"><b>◀ ▶</b><span>Move</span></div>
        <div class="key-row"><b>↻</b><span>Rotate</span></div>
        <div class="key-row"><b>▼</b><span>Soft drop</span></div>
        <div class="key-row"><b>SPACE</b><span>Hard drop</span></div>
        <div class="key-row"><b>C</b><span>Hold piece</span></div>
      </div>
    </section>

    <section id="settings" class="screen">
      <header class="subhead"><button class="back">‹</button><h2>SETTINGS</h2></header>
      <div class="settings-list">
        <label class="setting"><span>Sound effects</span><input type="checkbox" id="soundToggle" checked></label>
        <label class="setting"><span>Music</span><input type="checkbox" id="musicToggle"></label>
        <label class="setting"><span>Vibration</span><input type="checkbox" id="vibeToggle" checked></label>
        <label class="setting"><span>Ghost piece</span><input type="checkbox" id="ghostToggle" checked></label>
        <label class="setting"><span>Animations</span><input type="checkbox" id="animToggle" checked></label>
      </div>
      <button class="danger" id="resetData">RESET SAVED DATA</button>
    </section>

    <div id="overlay" class="overlay">
      <div class="modal">
        <h2 id="modalTitle">PAUSED</h2>
        <p id="modalText"></p>
        <button class="primary" id="resumeBtn">RESUME</button>
        <button class="glass" id="restartBtn">RESTART</button>
        <button class="text-btn" id="homeBtn">HOME</button>
      </div>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
